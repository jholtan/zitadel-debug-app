server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin" always;
  add_header Content-Security-Policy
      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:;"
      always;

  location = /callback.html {
    try_files /callback.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively (Vite fingerprints them)
  location ~* \.(?:js|css|woff2?|png|ico|svg)$ {
    expires     1y;
    add_header  Cache-Control "public, immutable";
  }

  # Never cache HTML files
  location ~* \.html$ {
    expires    -1;
    add_header Cache-Control "no-store";
  }

  # Health check endpoint for Kubernetes probes
  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Gzip
  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json;
  gzip_min_length 1024;
}
